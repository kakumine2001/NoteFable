name: Store listing PR checks

# App Store 的名称和描述由 docs/play-store/listing.md 拼出，比 Play 的完整说明长：Play 还没超限，App Store
# 可能已经超了。只改商店文档或 App Store 截图的 PR 也在这里检查（文件名不以 ios- 开头，免得改它时启动 iOS 的
# macOS 任务）。
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/app-store/listing.md"
      - "docs/play-store/listing.md"
      - "docs/app-store/review-info.md"
      # 订阅描述里写着 Pro 的存储上限，测试对照这里的数值。
      - "src/lib/usage-plans.ts"
      - "mobile/ios/app-store/screenshots/**"
      - ".github/workflows/store-listing-pr.yml"

permissions:
  contents: read

concurrency:
  group: store-listing-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate App Store listing documents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the listing documents
        run: python3 scripts/release/ios-store-listing.py --check
      - name: Test the App Store listing script
        run: python3 -m unittest discover -s scripts/release -p 'test_ios_store_listing.py' -v
