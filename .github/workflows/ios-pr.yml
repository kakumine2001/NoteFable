name: iOS PR checks

# 没有 Mac 时，这是唯一能真正编译 iOS App 的地方：版本校验 + Core 单元测试 + 模拟器构建（不签名）。
# macOS 机器按高倍率计费：版本校验先在 Linux 上快速运行，仅在存在 mobile/ios/project.yml 且校验通过时才启动 macOS。
on:
  pull_request:
    # No "edited": a title or body edit would cancel a running check. After retargeting a PR to main, push or reopen it.
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "mobile/ios/**"
      - "mobile/android/app/src/main/assets/**"
      - ".github/workflows/ios-*.yml"
      - "scripts/release/ios-version*.sh"
      - "scripts/release/ios-testflight-*.py"
      - "scripts/release/test_ios_testflight_*.py"
      - "scripts/release/verify-merged-pr*.sh"

permissions:
  contents: read

concurrency:
  group: ios-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version:
    name: Validate iOS version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_project: ${{ steps.detect.outputs.has_project }}
      ui_changed: ${{ steps.detect.outputs.ui_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test merged-PR verification script
        run: bash scripts/release/verify-merged-pr.test.sh
      - name: Test iOS version script
        run: bash scripts/release/ios-version.test.sh
      - name: Test iOS TestFlight distribution scripts
        run: python3 -m unittest discover -s scripts/release -p 'test_ios_testflight_*.py' -v
      - name: Validate iOS version
        run: bash scripts/release/ios-version.sh
      - name: Check iOS project presence
        id: detect
        run: |
          if [[ -f mobile/ios/project.yml ]]; then
            echo 'has_project=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_project=false' >> "$GITHUB_OUTPUT"
          fi
          if git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            if git diff --quiet HEAD^1 HEAD -- mobile/ios/NoteFable mobile/ios/Support mobile/ios/project.yml mobile/ios/scripts/ci-screenshots.sh mobile/android/app/src/main/assets .github/workflows/ios-pr.yml; then
              echo 'ui_changed=false' >> "$GITHUB_OUTPUT"
            else
              echo 'ui_changed=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'ui_changed=true' >> "$GITHUB_OUTPUT"
          fi

  ios:
    name: iOS tests and simulator build
    needs: version
    if: needs.version.outputs.has_project == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Xcode version
        # App Store Connect needs the iOS 27 SDK (ITMS-90725): stop early if the image default changes.
        run: |
          ver=$(xcodebuild -version)
          printf '%s\n' "$ver"
          major=$(awk '$1 == "Xcode" { split($2, v, "."); print v[1]; exit }' <<< "$ver")
          if ! [[ "$major" =~ ^[0-9]+$ ]] || (( 10#$major < 27 )); then
            echo "::error::Xcode ${major:-unknown} found; Xcode 27 or later is required."
            exit 1
          fi
      - name: Core unit tests
        working-directory: mobile/ios
        # A hung test would otherwise run until the job timeout: the script stops it and prints where it is stuck.
        run: bash scripts/ci-core-tests.sh
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator (unsigned)
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          set +e
          xcodebuild build \
            -project NoteFable.xcodeproj \
            -scheme NoteFable \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: unused|BUILD (SUCCEEDED|FAILED)|^\*\*"
          xcode_rc=${PIPESTATUS[0]}
          set -e
          (( xcode_rc == 0 ))
          grep -Eq '^\*\* BUILD SUCCEEDED \*\*$' build.log
      - name: Package the simulator app for screenshots
        if: needs.version.outputs.ui_changed == 'true'
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          app=build/DerivedData/Build/Products/Debug-iphonesimulator/NoteFable.app
          test -x "$app/NoteFable"
          archs=$(lipo -archs "$app/NoteFable")
          echo "archs: $archs"
          [[ " $archs " == *" arm64 "* ]]
          vtool -show-build "$app/NoteFable" | grep -E '^ *(platform|minos|sdk) '
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :MinimumOSVersion' "$app/Info.plist"
          codesign --force --deep --sign - --timestamp=none "$app"
          tar -C "$(dirname "$app")" -czf "$RUNNER_TEMP/NoteFable-sim.tgz" NoteFable.app
      - name: Upload the simulator app
        if: needs.version.outputs.ui_changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: NoteFable-sim.tgz
          path: ${{ runner.temp }}/NoteFable-sim.tgz
          archive: false
          retention-days: 3
          if-no-files-found: error
      - name: Compiler errors
        if: failure()
        working-directory: mobile/ios
        run: |
          if [ -f build.log ]; then grep -E "error:" build.log | sed "s#$PWD/##" | sort -u | head -n 400; fi
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-log
          path: mobile/ios/build.log
          if-no-files-found: ignore
          retention-days: 7

  ios-screenshots:
    name: iOS screenshots (${{ matrix.label }})
    needs: [version, ios]
    if: needs.version.outputs.ui_changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iOS 27
            runner: xcode-27
            majors: "27"
            artifact: ios-screenshots-ios27
          - label: iOS 26
            runner: macos-15
            majors: "26"
            artifact: ios-screenshots-ios26
          - label: iOS 18
            runner: macos-15
            majors: "18"
            artifact: ios-screenshots-ios18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: mobile/ios/scripts
      - uses: actions/download-artifact@v8
        with:
          name: NoteFable-sim.tgz
          path: ${{ runner.temp }}/app
      - name: Keep production unreachable (simulator apps use the host resolver)
        run: |
          printf '0.0.0.0 %s\n' app.notefable.com notefable.com www.notefable.com | sudo tee -a /etc/hosts >/dev/null
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder || true
      - name: Unpack simulator app
        run: |
          tar -xzf "$RUNNER_TEMP/app/NoteFable-sim.tgz" -C "$RUNNER_TEMP/app"
          test -x "$RUNNER_TEMP/app/NoteFable.app/NoteFable"
      - name: Capture fixture screenshots
        env:
          NF_IOS_MAJORS: ${{ matrix.majors }}
        run: bash mobile/ios/scripts/ci-screenshots.sh "$RUNNER_TEMP/app/NoteFable.app" "$RUNNER_TEMP/shots"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/shots
          retention-days: 14
          if-no-files-found: ignore
