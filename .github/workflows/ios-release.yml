name: iOS release to App Store Connect

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional 40-char merge commit SHA on main to replay (defaults to main HEAD)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'push' || (github.event.deleted != true && github.event.forced != true))
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      build_number: ${{ steps.version.outputs.build_number }}
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      commit_sha: ${{ steps.target.outputs.sha }}
      whats_new_b64: ${{ steps.notes.outputs.whats_new_b64 }}
    steps:
      # Check out main, resolve the target commit (push SHA or manual replay SHA on main's first-parent history),
      # and verify it came from a merged PR targeting main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve target commit
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_SHA: ${{ github.sha }}
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          target_sha="$DEFAULT_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_SHA" ]]; then
            if [[ ! "$INPUT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::commit_sha must be a 40-character commit SHA."
              exit 1
            fi
            target_sha=$(git rev-parse --verify "${INPUT_SHA}^{commit}") || {
              echo "::error::Commit $INPUT_SHA not found in main history."
              exit 1
            }
            if ! git rev-list --first-parent HEAD | awk -v target="$target_sha" '$0 == target { found = 1 } END { exit !found }'; then
              echo "::error::Commit $target_sha is not on main's first-parent history."
              exit 1
            fi
          fi
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
      - name: Verify commit is a merged PR targeting main
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.target.outputs.sha }}
        run: bash scripts/release/verify-merged-pr.sh
      - name: Compare iOS version with main before the merge
        if: steps.pr.outputs.is_merged_pr == 'true'
        id: version
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_SHA" != "$(git rev-parse HEAD)" ]]; then
            git checkout --detach "$TARGET_SHA"
          fi
          bash scripts/release/ios-version.sh
      - name: Resolve TestFlight What to Test notes
        if: steps.version.outputs.publish == 'true'
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Restore the workflow revision so replays of older merges still have ios-testflight-notes.py.
          if [[ "$WORKFLOW_SHA" != "$(git rev-parse HEAD)" ]]; then
            git checkout --detach "$WORKFLOW_SHA"
          fi
          pr_body_file="$RUNNER_TEMP/pr-body.md"
          whats_new_file="$RUNNER_TEMP/whats-new.txt"
          if [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""' > "$pr_body_file"; then
              echo "::warning::Failed to fetch PR #$PR_NUMBER body; falling back to default TestFlight notes."
              : > "$pr_body_file"
            fi
          else
            : > "$pr_body_file"
          fi
          python3 scripts/release/ios-testflight-notes.py --pr-body-file "$pr_body_file" > "$whats_new_file"
          echo "Resolved TestFlight What to Test notes:"
          cat "$whats_new_file"
          encoded=$(python3 -c 'import base64, sys; print(base64.b64encode(open(sys.argv[1], "rb").read()).decode("ascii"))' "$whats_new_file")
          printf 'whats_new_b64=%s\n' "$encoded" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    outputs:
      uploaded: ${{ steps.current.outputs.publish }}
    # App Store Connect requires the iOS 27 SDK from April 2027 (ITMS-90725); the xcode-27 image defaults to Xcode 27.
    # Never write build outputs from this secret-holding job to the shared Actions cache.
    runs-on: xcode-27
    timeout-minutes: 45
    environment: appstore-publish
    concurrency:
      group: ios-appstore-testflight
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Skip superseded iOS releases
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::Invalid planned iOS build number."
            exit 1
          fi
          config=mobile/ios/project.yml
          current=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/$config?ref=main" \
            | bash scripts/release/ios-version.sh --parse-build)
          if ! [[ "$current" =~ ^[1-9][0-9]{0,8}$ ]] || (( current < RELEASE_BUILD_NUMBER )); then
            echo "::error::Could not verify the current iOS build number on main."
            exit 1
          fi
          if (( current > RELEASE_BUILD_NUMBER )); then
            echo "Skipping build $RELEASE_BUILD_NUMBER. Main has build $current."
            exit 0
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Check App Store Connect credentials
        if: steps.current.outputs.publish == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8_B64: ${{ secrets.APPSTORE_API_KEY_P8_B64 }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_IOS_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_IOS_REVERSED_CLIENT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$APPLE_TEAM_ID" ]] || missing+=(APPLE_TEAM_ID)
          [[ -n "$APPSTORE_API_KEY_ID" ]] || missing+=(APPSTORE_API_KEY_ID)
          [[ -n "$APPSTORE_API_ISSUER_ID" ]] || missing+=(APPSTORE_API_ISSUER_ID)
          [[ -n "$APPSTORE_API_KEY_P8_B64" ]] || missing+=(APPSTORE_API_KEY_P8_B64)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required secrets in appstore-publish: ${missing[*]}."
            exit 1
          fi
          if ! [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be a 10-character uppercase alphanumeric Apple Team ID."
            exit 1
          fi
          if ! [[ "$APPSTORE_API_KEY_ID" =~ ^[A-Za-z0-9]{6,20}$ ]]; then
            echo "::error::APPSTORE_API_KEY_ID must be an alphanumeric App Store Connect API Key ID."
            exit 1
          fi
          if ! [[ "$APPSTORE_API_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::APPSTORE_API_ISSUER_ID must be a UUID."
            exit 1
          fi
          if [[ ( -n "$GOOGLE_IOS_CLIENT_ID" && -z "$GOOGLE_IOS_REVERSED_CLIENT_ID" ) || ( -z "$GOOGLE_IOS_CLIENT_ID" && -n "$GOOGLE_IOS_REVERSED_CLIENT_ID" ) ]]; then
            echo "::error::Set both GOOGLE_IOS_CLIENT_ID and GOOGLE_IOS_REVERSED_CLIENT_ID, or leave both unset."
            exit 1
          fi
          if [[ -n "$GOOGLE_IOS_CLIENT_ID" ]]; then
            if ! [[ "$GOOGLE_IOS_CLIENT_ID" =~ ^[A-Za-z0-9._-]+$ ]] || ! [[ "$GOOGLE_IOS_REVERSED_CLIENT_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::GOOGLE_IOS_CLIENT_ID and GOOGLE_IOS_REVERSED_CLIENT_ID contain invalid characters."
              exit 1
            fi
          fi
          python3 -c '
          import base64, os, subprocess, sys
          raw = "".join(os.environ["APPSTORE_API_KEY_P8_B64"].split())
          try:
              pem = base64.b64decode(raw, validate=True)
          except Exception:
              print("::error::APPSTORE_API_KEY_P8_B64 is not valid Base64.", file=sys.stderr)
              sys.exit(1)
          if b"-----BEGIN PRIVATE KEY-----" not in pem or b"-----END PRIVATE KEY-----" not in pem:
              print("::error::APPSTORE_API_KEY_P8_B64 must decode to an App Store Connect .p8 PEM private key.", file=sys.stderr)
              sys.exit(1)
          proc = subprocess.run(
              ["openssl", "pkey", "-inform", "PEM", "-noout"],
              input=pem,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          if proc.returncode != 0:
              print("::error::APPSTORE_API_KEY_P8_B64 could not be parsed as a valid PEM private key.", file=sys.stderr)
              sys.exit(1)
          '

      - name: Xcode version
        if: steps.current.outputs.publish == 'true'
        # App Store Connect needs the iOS 27 SDK (ITMS-90725): stop before archiving if the image default changes.
        run: |
          ver=$(xcodebuild -version)
          printf '%s\n' "$ver"
          major=$(awk '$1 == "Xcode" { split($2, v, "."); print v[1]; exit }' <<< "$ver")
          if ! [[ "$major" =~ ^[0-9]+$ ]] || (( 10#$major < 27 )); then
            echo "::error::Xcode ${major:-unknown} found; Xcode 27 or later is required."
            exit 1
          fi

      - name: Core unit tests
        if: steps.current.outputs.publish == 'true'
        working-directory: mobile/ios
        # A hung test would otherwise run until the job timeout: the script stops it and prints where it is stuck.
        run: bash scripts/ci-core-tests.sh

      - name: Generate Xcode project
        if: steps.current.outputs.publish == 'true'
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build release archive
        if: steps.current.outputs.publish == 'true'
        working-directory: mobile/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_IOS_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_IOS_REVERSED_CLIENT_ID }}
          EXPECTED_BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
          EXPECTED_MARKETING_VERSION: ${{ needs.plan.outputs.marketing_version }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p Config
          archive_path="$RUNNER_TEMP/NoteFable.xcarchive"
          archive_ok=false
          cleanup_archive_step() {
            rm -f -- Config/Local.xcconfig
            if [[ "$archive_ok" != true ]]; then
              rm -rf -- "$archive_path"
            fi
          }
          trap cleanup_archive_step EXIT
          {
            printf 'DEVELOPMENT_TEAM = %s\n' "$APPLE_TEAM_ID"
            if [[ -n "$GOOGLE_IOS_CLIENT_ID" ]]; then
              printf 'GOOGLE_IOS_CLIENT_ID = %s\n' "$GOOGLE_IOS_CLIENT_ID"
              printf 'GOOGLE_IOS_REVERSED_CLIENT_ID = %s\n' "$GOOGLE_IOS_REVERSED_CLIENT_ID"
            fi
          } > Config/Local.xcconfig

          rm -rf -- "$archive_path"
          xcodebuild archive \
            -project NoteFable.xcodeproj \
            -scheme NoteFable \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

          app_path="$archive_path/Products/Applications/NoteFable.app"
          if [[ ! -d "$app_path" ]]; then
            echo "::error::Expected archived app bundle at $app_path."
            exit 1
          fi

          actual_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")
          actual_marketing=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")
          if [[ "$actual_build" != "$EXPECTED_BUILD_NUMBER" || "$actual_marketing" != "$EXPECTED_MARKETING_VERSION" ]]; then
            echo "::error::Archived app version $actual_marketing ($actual_build) does not match planned $EXPECTED_MARKETING_VERSION ($EXPECTED_BUILD_NUMBER)."
            exit 1
          fi

          # CODE_SIGNING_ALLOWED=NO skips embedding entitlements during archive; resolve each target's
          # configured CODE_SIGN_ENTITLEMENTS and attach it with an ad-hoc signature so exportArchive
          # preserves capabilities (Associated Domains and the App Group the share extension hands content over through).
          # Drain stdin completely so xcodebuild never hits SIGPIPE.
          entitlements_of() {
            xcodebuild -project NoteFable.xcodeproj -target "$1" -configuration Release -showBuildSettings \
              | awk -F ' = ' '!found && $1 ~ /^[[:space:]]*CODE_SIGN_ENTITLEMENTS$/ { val = $2; found = 1 } END { if (found) print val }'
          }
          # The share extension is signed first: the app's signature seals the nested code.
          appex_path="$app_path/PlugIns/NoteFableShareExtension.appex"
          if [[ -d "$appex_path" ]]; then
            appex_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$appex_path/Info.plist")
            appex_marketing=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$appex_path/Info.plist")
            if [[ "$appex_build" != "$EXPECTED_BUILD_NUMBER" || "$appex_marketing" != "$EXPECTED_MARKETING_VERSION" ]]; then
              echo "::error::Share extension version $appex_marketing ($appex_build) does not match planned $EXPECTED_MARKETING_VERSION ($EXPECTED_BUILD_NUMBER)."
              exit 1
            fi
            appex_entitlements=$(entitlements_of NoteFableShareExtension)
            if [[ -z "$appex_entitlements" || ! -f "$appex_entitlements" ]]; then
              echo "::error::Share extension entitlements file not found: ${appex_entitlements:-<unset>}"
              exit 1
            fi
            codesign --force --sign "-" \
              --entitlements "$appex_entitlements" \
              "$appex_path"
          fi
          entitlements=$(entitlements_of NoteFable)
          if [[ -n "$entitlements" ]]; then
            if [[ ! -f "$entitlements" ]]; then
              echo "::error::Configured CODE_SIGN_ENTITLEMENTS file not found: $entitlements"
              exit 1
            fi
            codesign --force --sign "-" \
              --entitlements "$entitlements" \
              "$app_path"
          fi
          archive_ok=true

      - name: Export cloud-signed IPA and upload to App Store Connect
        if: steps.current.outputs.publish == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8_B64: ${{ secrets.APPSTORE_API_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          umask 077
          archive_path="$RUNNER_TEMP/NoteFable.xcarchive"
          key_dir=$(mktemp -d "$RUNNER_TEMP/asc-keys.XXXXXX")
          export_dir=$(mktemp -d "$RUNNER_TEMP/ios-export.XXXXXX")
          opts_dir=$(mktemp -d "$RUNNER_TEMP/export-options.XXXXXX")
          export_options="$opts_dir/ExportOptions.plist"
          trap 'rm -rf -- "$key_dir" "$export_dir" "$opts_dir" "$archive_path"' EXIT

          key_file="$key_dir/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          python3 -c '
          import base64, os, sys
          raw = "".join(os.environ["APPSTORE_API_KEY_P8_B64"].split())
          with open(sys.argv[1], "wb") as f:
              f.write(base64.b64decode(raw, validate=True))
          ' "$key_file"
          unset APPSTORE_API_KEY_P8_B64

          python3 -c '
          import os, plistlib, sys
          options = {
              "method": "app-store-connect",
              "signingStyle": "automatic",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "destination": "export",
              "uploadSymbols": True,
              "manageAppVersionAndBuildNumber": False,
          }
          with open(sys.argv[1], "wb") as f:
              plistlib.dump(options, f)
          ' "$export_options"

          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_dir" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_file" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"

          shopt -s nullglob
          ipas=("$export_dir"/*.ipa)
          if (( ${#ipas[@]} != 1 )); then
            echo "::error::Expected exactly 1 exported .ipa in $export_dir, found ${#ipas[@]}."
            exit 1
          fi

          API_PRIVATE_KEYS_DIR="$key_dir" xcrun altool --upload-app \
            --type ios \
            --file "${ipas[0]}" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"

  distribute_external:
    needs: [plan, release]
    if: needs.plan.outputs.publish == 'true' && needs.release.outputs.uploaded == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: appstore-publish
    concurrency:
      group: ios-appstore-testflight-external
      cancel-in-progress: false
      queue: max
    steps:
      # Check out the workflow revision (not commit_sha) so manual replays of older merges still have the scripts.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Distribute build to TestFlight External group
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8_B64: ${{ secrets.APPSTORE_API_KEY_P8_B64 }}
          MARKETING_VERSION: ${{ needs.plan.outputs.marketing_version }}
          BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
          WHATS_NEW_B64: ${{ needs.plan.outputs.whats_new_b64 }}
        run: |
          set -euo pipefail
          whats_new_file="$RUNNER_TEMP/whats-new.txt"
          python3 -c 'import base64, os, sys; open(sys.argv[1], "wb").write(base64.b64decode(os.environ["WHATS_NEW_B64"]))' "$whats_new_file"
          python3 scripts/release/ios-testflight-distribute.py \
            --bundle-id com.kakumine.notefable \
            --marketing-version "$MARKETING_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --group-name External \
            --locale en-US \
            --whats-new-file "$whats_new_file" \
            --poll-interval 20 \
            --poll-timeout 1200
