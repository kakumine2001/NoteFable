name: Android PR checks

on:
  pull_request:
    # No "edited": a title or body edit would cancel a running check. After retargeting a PR to main, push or reopen it.
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-*.yml"
      - "scripts/release/android-version.sh"
      - "scripts/release/verify-merged-pr*.sh"

permissions:
  contents: read

concurrency:
  group: android-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test merged-PR verification script
        run: bash scripts/release/verify-merged-pr.test.sh
      - name: Validate Android version
        run: bash scripts/release/android-version.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Use the MIT-licensed basic cache provider instead of proprietary enhanced caching.
          cache-provider: basic
      - name: Android unit tests
        working-directory: mobile/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
