name: Android release

# 发版方式（二选一）：
# 1. 给目标 commit 打标签 android-v<versionName>（例如 android-v1.0.13）并推送，
#    自动构建签名 AAB 并发布到 Play 内部测试轨道。标签里的版本号必须与
#    mobile/android/app/build.gradle.kts 的 versionName 一致（不一致直接失败），
#    且 versionCode 必须比 Play 上已有的大（提交前先在 build.gradle.kts 里 +1）。
# 2. 在 Actions 页面手动运行（workflow_dispatch），自选轨道和发布状态。
#
# 签名与发布凭据全部来自仓库 Secrets（不进仓库）：
#   NOTEFABLE_KEYSTORE_B64            上传密钥库（.jks）的 base64
#   NOTEFABLE_KEYSTORE_PASSWORD       密钥库密码
#   NOTEFABLE_KEY_ALIAS               密钥别名
#   NOTEFABLE_KEY_PASSWORD            密钥密码
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON  有 Play 发布权限的服务账号 JSON
# 版本说明：若 mobile/android/play-store/release-notes.txt 存在，其内容作为本次说明。

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      status:
        description: "Release status"
        type: choice
        options:
          - completed
          - draft
        default: completed

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve track, status and version
        id: meta
        shell: bash
        env:
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_STATUS: ${{ inputs.status }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          track="$INPUT_TRACK"
          status="$INPUT_STATUS"
          if [ "$EVENT_NAME" = "push" ]; then
            track="internal"
            status="completed"
          fi
          version_name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' mobile/android/app/build.gradle.kts)
          version_code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' mobile/android/app/build.gradle.kts)
          if [ "$EVENT_NAME" = "push" ]; then
            tag_version="${TAG_NAME#android-v}"
            if [ "$tag_version" != "$version_name" ]; then
              echo "::error::Tag $TAG_NAME does not match versionName $version_name in build.gradle.kts"
              exit 1
            fi
          fi
          {
            echo "track=$track"
            echo "status=$status"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version_name ($version_code) to track=$track status=$status"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write upload signing config
        env:
          KEYSTORE_B64: ${{ secrets.NOTEFABLE_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.NOTEFABLE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOTEFABLE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.NOTEFABLE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PW" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PW" ]; then
            echo "::error::Signing secrets are missing (NOTEFABLE_KEYSTORE_B64 / NOTEFABLE_KEYSTORE_PASSWORD / NOTEFABLE_KEY_ALIAS / NOTEFABLE_KEY_PASSWORD)"
            exit 1
          fi
          signing_dir="$RUNNER_TEMP/notefable-signing"
          mkdir -p "$signing_dir" "$HOME/.gradle"
          echo "$KEYSTORE_B64" | base64 -d > "$signing_dir/upload.jks"
          {
            printf 'notefable.upload.storeFile=%s\n' "$signing_dir/upload.jks"
            printf 'notefable.upload.storePassword=%s\n' "$STORE_PW"
            printf 'notefable.upload.keyAlias=%s\n' "$KEY_ALIAS"
            printf 'notefable.upload.keyPassword=%s\n' "$KEY_PW"
          } > "$HOME/.gradle/gradle.properties"
          chmod 600 "$HOME/.gradle/gradle.properties"

      - name: Build signed AAB
        working-directory: mobile/android
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: notefable-${{ steps.meta.outputs.version_name }}-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          notes_file="mobile/android/play-store/release-notes.txt"
          if [ -f "$notes_file" ]; then
            {
              echo "text<<RELEASE_NOTES_EOF"
              cat "$notes_file"
              echo "RELEASE_NOTES_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "text=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kakumine.notefable
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.meta.outputs.track }}
          status: ${{ steps.meta.outputs.status }}
          releaseName: ${{ steps.meta.outputs.version_name }}
          releaseNotes: ${{ steps.notes.outputs.text }}
