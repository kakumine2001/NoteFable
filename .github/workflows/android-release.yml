name: Android internal release

# Release contract:
#   1. Merge the Android change to main and bump versionCode / versionName.
#   2. Push android-v<versionName> pointing to a commit already on main.
#   3. CI tests, signs one AAB, uploads that exact artifact to Play internal.
#   4. Promote that already-uploaded versionCode via android-promote.yml;
#      NEVER build and upload it again when switching Play tracks.
on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

# Google Play only allows one live edit at a time. Also serialize promotions.
concurrency:
  group: android-play-deploy
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check merged commit and tag/version match
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # Tags can point at unreviewed branch commits. Only release from main history.
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Tag must reference a commit already merged to main"
            exit 1
          fi
          version_file="mobile/android/app/build.gradle.kts"
          version_name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$version_file")
          version_code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$version_file")
          tag_name="${GITHUB_REF_NAME}"
          if [ "$tag_name" != "android-v$version_name" ]; then
            echo "::error::Tag $tag_name does not match versionName $version_name"
            exit 1
          fi
          if ! [[ "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid versionCode $version_code"
            exit 1
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Verified tag $tag_name and main-merged versionCode $version_code"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests
        working-directory: mobile/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Decode upload keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NOTEFABLE_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.NOTEFABLE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOTEFABLE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.NOTEFABLE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PW" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PW" ]; then
            echo "::error::Missing Android upload signing secrets"
            exit 1
          fi
          signing_dir="$RUNNER_TEMP/notefable-signing"
          mkdir -p "$signing_dir"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$signing_dir/upload.jks"
          echo "keystore_path=$signing_dir/upload.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed AAB
        working-directory: mobile/android
        env:
          STORE_PW: ${{ secrets.NOTEFABLE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOTEFABLE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.NOTEFABLE_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
        run: >-
          ./gradlew :app:bundleRelease --no-daemon
          -Pnotefable.upload.storeFile="$KEYSTORE_PATH"
          -Pnotefable.upload.storePassword="$STORE_PW"
          -Pnotefable.upload.keyAlias="$KEY_ALIAS"
          -Pnotefable.upload.keyPassword="$KEY_PW"

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: notefable-${{ steps.meta.outputs.version_code }}-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment should permit only android-v* tags. Secret must live here,
    # never in repository-level Secrets or source files.
    environment: play-publish
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Download the tested AAB
        uses: actions/download-artifact@v4
        with:
          name: notefable-${{ needs.build.outputs.version_code }}-aab
          path: aab

      - name: Prepare optional localized release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/play-whatsnew"
          mkdir -p "$directory"
          file="mobile/android/play-store/release-notes.txt"
          if [ -f "$file" ]; then
            cp "$file" "$directory/whatsnew-en-US"
          fi
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - name: Upload once to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kakumine.notefable
          releaseFiles: aab/app-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ needs.build.outputs.version_name }}
          whatsNewDirectory: ${{ steps.notes.outputs.directory }}
