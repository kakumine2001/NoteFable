name: Android release to Play alpha

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    if: github.event.pull_request.merged == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      # Check out the commit merged into main. This event has base-repository privileges.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare Android version with main before the merge
        id: version
        shell: bash
        run: bash scripts/release/android-version.sh

  release:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play-publish
    concurrency:
      group: android-play-alpha
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Skip superseded Android releases
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION_CODE: ${{ needs.plan.outputs.version_code }}
        run: |
          set -euo pipefail
          config=mobile/android/app/build.gradle.kts
          current=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/$config?ref=main" \
            | sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p')
          if ! [[ "$current" =~ ^[1-9][0-9]{0,9}$ ]] || (( current < RELEASE_VERSION_CODE )); then
            echo "::error::Could not verify the current release version on main."
            exit 1
          fi
          if (( current > RELEASE_VERSION_CODE )); then
            echo "Skipping versionCode $RELEASE_VERSION_CODE. Main has versionCode $current."
            exit 0
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Check Play credential
        if: steps.current.outputs.publish == 'true'
        env:
          PLAY_CREDENTIAL: ${{ secrets.ALPHA_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$PLAY_CREDENTIAL" ]]; then
            echo "::error::Missing ALPHA_PLAY_SERVICE_ACCOUNT_JSON in play-publish."
            exit 1
          fi

      - uses: actions/setup-java@v4
        if: steps.current.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        if: steps.current.outputs.publish == 'true'
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.current.outputs.publish == 'true'
        with:
          # This job holds signing secrets: never write its build outputs to the shared Actions cache.
          cache-read-only: true

      - name: Android unit tests
        if: steps.current.outputs.publish == 'true'
        working-directory: mobile/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build signed AAB
        if: steps.current.outputs.publish == 'true'
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ALPHA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing Android signing credentials in play-publish."
            exit 1
          fi
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/android-upload.XXXXXX")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          unset KEYSTORE_B64
          env "ORG_GRADLE_PROJECT_notefable.upload.storeFile=$keystore" \
              "ORG_GRADLE_PROJECT_notefable.upload.storePassword=$STORE_PASSWORD" \
              "ORG_GRADLE_PROJECT_notefable.upload.keyAlias=$KEY_ALIAS" \
              "ORG_GRADLE_PROJECT_notefable.upload.keyPassword=$KEY_PASSWORD" \
              "$BASH" ./gradlew :app:bundleRelease --no-daemon

      - name: Prepare optional release notes
        if: steps.current.outputs.publish == 'true'
        id: notes
        run: |
          set -euo pipefail
          source=mobile/android/play-store/release-notes.txt
          # Use the notes only when this merge changed them, so one release's notes are not reused.
          if [[ -s "$source" ]] && ! git diff --quiet HEAD^1 HEAD -- "$source"; then
            directory=$(mktemp -d "$RUNNER_TEMP/play-whatsnew.XXXXXX")
            cp -- "$source" "$directory/whatsnew-en-US"
            echo "directory=$directory" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB to Google Play closed testing
        if: steps.current.outputs.publish == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.ALPHA_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kakumine.notefable
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: mobile/android/app/build/outputs/mapping/release/mapping.txt
          tracks: alpha
          status: completed
          whatsNewDirectory: ${{ steps.notes.outputs.directory }}
