name: Android release to Play internal and alpha

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional 40-char merge commit SHA on main to replay (defaults to main HEAD)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'push' || (github.event.deleted != true && github.event.forced != true))
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version_code: ${{ steps.version.outputs.version_code }}
      commit_sha: ${{ steps.target.outputs.sha }}
    steps:
      # Check out main, resolve the target commit (push SHA or manual replay SHA on main's first-parent history),
      # and verify it came from a merged PR targeting main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve target commit
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_SHA: ${{ github.sha }}
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          target_sha="$DEFAULT_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_SHA" ]]; then
            if [[ ! "$INPUT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::commit_sha must be a 40-character commit SHA."
              exit 1
            fi
            target_sha=$(git rev-parse --verify "${INPUT_SHA}^{commit}") || {
              echo "::error::Commit $INPUT_SHA not found in main history."
              exit 1
            }
            if ! git rev-list --first-parent HEAD | awk -v target="$target_sha" '$0 == target { found = 1 } END { exit !found }'; then
              echo "::error::Commit $target_sha is not on main's first-parent history."
              exit 1
            fi
          fi
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
      - name: Verify commit is a merged PR targeting main
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.target.outputs.sha }}
        run: bash scripts/release/verify-merged-pr.sh
      - name: Compare Android version with main before the merge
        if: steps.pr.outputs.is_merged_pr == 'true'
        id: version
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_SHA" != "$(git rev-parse HEAD)" ]]; then
            git checkout --detach "$TARGET_SHA"
          fi
          bash scripts/release/android-version.sh

  release:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play-publish
    concurrency:
      group: android-play-alpha
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Skip superseded Android releases
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION_CODE: ${{ needs.plan.outputs.version_code }}
        run: |
          set -euo pipefail
          config=mobile/android/app/build.gradle.kts
          current=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/$config?ref=main" \
            | sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p')
          if ! [[ "$current" =~ ^[1-9][0-9]{0,9}$ ]] || (( current < RELEASE_VERSION_CODE )); then
            echo "::error::Could not verify the current release version on main."
            exit 1
          fi
          if (( current > RELEASE_VERSION_CODE )); then
            echo "Skipping versionCode $RELEASE_VERSION_CODE. Main has versionCode $current."
            exit 0
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Check Play credential
        if: steps.current.outputs.publish == 'true'
        env:
          PLAY_CREDENTIAL: ${{ secrets.ALPHA_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$PLAY_CREDENTIAL" ]]; then
            echo "::error::Missing ALPHA_PLAY_SERVICE_ACCOUNT_JSON in play-publish."
            exit 1
          fi

      - uses: actions/setup-java@v6
        if: steps.current.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        if: steps.current.outputs.publish == 'true'
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        if: steps.current.outputs.publish == 'true'
        with:
          # Use the MIT-licensed basic cache provider instead of proprietary enhanced caching.
          cache-provider: basic
          # This job holds signing secrets: never write its build outputs to the shared Actions cache.
          cache-read-only: true

      - name: Android unit tests
        if: steps.current.outputs.publish == 'true'
        working-directory: mobile/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build signed AAB
        if: steps.current.outputs.publish == 'true'
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ALPHA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing Android signing credentials in play-publish."
            exit 1
          fi
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/android-upload.XXXXXX")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          unset KEYSTORE_B64
          env "ORG_GRADLE_PROJECT_notefable.upload.storeFile=$keystore" \
              "ORG_GRADLE_PROJECT_notefable.upload.storePassword=$STORE_PASSWORD" \
              "ORG_GRADLE_PROJECT_notefable.upload.keyAlias=$KEY_ALIAS" \
              "ORG_GRADLE_PROJECT_notefable.upload.keyPassword=$KEY_PASSWORD" \
              "$BASH" ./gradlew :app:bundleRelease --no-daemon

      - name: Prepare optional release notes
        if: steps.current.outputs.publish == 'true'
        id: notes
        run: |
          set -euo pipefail
          source=mobile/android/play-store/release-notes.txt
          # Use the notes only when this merge changed them, so one release's notes are not reused.
          if [[ -s "$source" ]] && ! git diff --quiet HEAD^1 HEAD -- "$source"; then
            directory=$(mktemp -d "$RUNNER_TEMP/play-whatsnew.XXXXXX")
            cp -- "$source" "$directory/whatsnew-en-US"
            echo "directory=$directory" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::This release PR did not change $source, so the release has no What's new text."
          fi

      - name: Upload AAB to Google Play internal and closed testing
        if: steps.current.outputs.publish == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.ALPHA_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kakumine.notefable
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal,alpha
          status: completed
          whatsNewDirectory: ${{ steps.notes.outputs.directory }}
