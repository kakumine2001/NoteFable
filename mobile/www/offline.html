<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StudyMate</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #fff; color: #37352f; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 22rem; padding: 2rem; text-align: center; }
    h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
    p { margin: 0 0 1.25rem; color: rgba(55, 53, 47, .65); line-height: 1.6; font-size: .95rem; }
    button { height: 40px; padding: 0 1.25rem; border: 0; border-radius: 8px; background: #2383e2; color: #fff; font-size: .95rem; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <h1>Can't reach StudyMate</h1>
    <p>Check your internet connection, then try again.</p>
    <button type="button" onclick="location.href = 'https://studymate-lab-ai.vercel.app/'">Try again</button>
  </main>
</body>
</html>
