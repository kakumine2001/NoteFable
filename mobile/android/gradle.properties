org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 服务器地址。默认线上；本机联调时加 -Pstudymate.baseUrl=http://10.0.2.2:3000（仅 debug 包允许明文 HTTP）。
# 暂时仍用旧网址：设备身份 Cookie 存在这个主机名下，直接换成 notefable.com 会让已安装的 App 换成新的匿名身份、
# 看不到以前的聊天和笔记。等 App 能把 Cookie 迁到新主机名后再改（docs/architecture/android-native.md）。
studymate.baseUrl=https://studymate-lab-ai.vercel.app
