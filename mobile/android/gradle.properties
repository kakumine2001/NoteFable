org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 服务器地址（工作区的主机）。默认线上；本机联调时加 -Pnotefable.baseUrl=http://10.0.2.2:3000（仅 debug 包允许明文 HTTP）。
notefable.baseUrl=https://app.notefable.com
# 介绍页和法律页面的主机（帮助菜单打开的网页）。本机联调时和 baseUrl 一样，加 -Pnotefable.siteUrl=http://10.0.2.2:3000。
notefable.siteUrl=https://notefable.com
