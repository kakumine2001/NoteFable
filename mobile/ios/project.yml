# XcodeGen 工程定义。在 Mac 上：brew install xcodegen && xcodegen generate，然后打开 NoteFable.xcodeproj。
# 生成的 .xcodeproj 不进仓库（.gitignore）；增删源文件不用改这里，NoteFable/ 下的文件都会被收进去。
name: NoteFable
options:
  bundleIdPrefix: com.kakumine
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configFiles:
  Debug: Config/NoteFable.xcconfig
  Release: Config/NoteFable.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "11"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    minorVersion: 0.7.3
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    from: 1.7.3
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.0.0

targets:
  NoteFable:
    type: application
    platform: iOS
    sources:
      - path: NoteFable
      # 和 Android 共用的打包资源（由 scripts/gen-native-*.ts 从网页源码生成），不另存一份。
      - path: ../android/app/src/main/assets/models.json
        group: SharedAssets
        buildPhase: resources
      - path: ../android/app/src/main/assets/system-text.json
        group: SharedAssets
        buildPhase: resources
      - path: ../android/app/src/main/assets/usage-limits.json
        group: SharedAssets
        buildPhase: resources
      - path: ../android/app/src/main/assets/emoji.json
        group: SharedAssets
        buildPhase: resources
      - path: ../android/app/src/main/assets/page-kinds.json
        group: SharedAssets
        buildPhase: resources
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: SwiftMath
        product: SwiftMath
      - package: GoogleSignIn
        product: GoogleSignIn
      # 系统「分享」里的 NoteFable：随主 App 一起打包（见下面的 NoteFableShareExtension）。
      - target: NoteFableShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kakumine.notefable
        PRODUCT_NAME: NoteFable
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/NoteFable.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 系统弹出的界面（提示框、确认菜单、选字光标）没单独设 tint 时用的强调色：AccentColor（#2383E2），不是系统蓝。
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO

  # 分享扩展（com.apple.share-services）：把分享来的文字、链接、图片、文件写进 App Group 的共享目录再唤起主 App。
  # 版本号（MARKETING_VERSION / CURRENT_PROJECT_VERSION）用上面 settings.base 的，不在这里重复写
  # （scripts/release/ios-version.sh 要求这两项在文件里各只出现一次）。ShareIntake.swift 只依赖 Foundation，所以能同时编进两边。
  NoteFableShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: NoteFable/Core/Chat/ShareIntake.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kakumine.notefable.ShareExtension
        PRODUCT_NAME: NoteFableShareExtension
        INFOPLIST_FILE: ShareExtension/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/Support/ShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO

schemes:
  NoteFable:
    build:
      targets:
        NoteFable: all
    run:
      config: Debug
    archive:
      config: Release
