services:
  - type: web
    name: studymate
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run prisma:migrate && npm run start
    disk:
      name: studymate-storage
      mountPath: /var/data/studymate
      sizeGB: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://sub.khurio.art/v1
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: STUDYMATE_STORAGE_DIR
        value: /var/data/studymate
      - key: COOKIE_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: render_db
          property: connectionString
