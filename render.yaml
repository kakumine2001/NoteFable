services:
  - type: web
    name: studymate
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run prisma:migrate && npm run start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://sub.khurio.art/v1
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: COOKIE_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: studymate-db
          property: connectionString

databases:
  - name: studymate-db
    plan: free
