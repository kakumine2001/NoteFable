services:
  - type: web
    name: studymate
    runtime: node
    plan: free
    buildCommand: npm ci && npm run prisma:migrate && npm run build
    startCommand: npm run start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://sub.khurio.art/v1
      - key: OPENAI_TEXT_MODEL
        value: gpt-5.6-sol
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
